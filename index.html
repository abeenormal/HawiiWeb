<!DOCTYPE html>

<html lang="en"> 
<head>    
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Hawaii</title>
   <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Tangerine">
   <link href="hstyles.css" rel="stylesheet" />
   <script src="video.js" defer></script>
</head>

<body>
   <header>
      <div class="grid-container">
         <div class="left-image">
            <img src="sunset.jpg" alt="sunset" class="sunset">
         </div>
         <div class="top-text">
           <h2> Hawaiian Islands<br>
            This is an inspiring story of a dream come true.</h2>
         </div>
         <div class="bottom-image">
           <img src="Pridetranspng.png" alt="Main Left Image" class="image-1">
         </div>
      </div>   
   </header>

   <div class="grid-container-2">        
      <img src="statue.jpg" alt="Dancing Left" class="rounded-image"  />

   
      <div class="vince">
          <video src="vince.mp4" type="video/mp4" id="video"></video>

          <div class="custom-controls">       
            <button id="play-pause" class="media-button">
               <span class="icon">&#9654;</span>
               <span class="text">Play</span>
            </button>

            <button id="mute" class="media-button">
               <span class="icon">&#128263;</span>
               <span class="text">Mute</span>
            </button>
            <button id="closeBtn" class="media-button close-btn">
               <span class="icon">&#10005;</span>
               <span class="text">Close</span>
            </button>
         </div>
      </div>
            

      <img src="statue.jpg" alt="Dancing Right" class="rounded-image-flipped">   
   </div>  
      
   <div class="text-container">
   <h2> We are settling into the rhythm of ship life</h2>  
   </div>

   <div class="image-grid">   
     
      <div class="image-wrapper"><img src="wood.jpg" alt="Wood"></div>
      <div class="image-wrapper"><img src="chairs.jpg" alt="Chairs"></div>
      <div class="image-wrapper"><img src="volcano.jpg" alt="Chairs"></div>
      <div class="image-wrapper"><img src="champagne.jpg" alt="Bus Tour"></div>
      <div class="image-wrapper"><img src="trees.jpg" alt="tree-show"></div>
      <div class="image-wrapper"><img src="Couple.jpg" alt="Couple"></div>                                    
      <div class="image-wrapper"><img src="hawainsun.jpg" alt="HawaianSun"></div>
      <div class="image-wrapper"><img src="shipwater.jpg" alt="Choppy-sea"></div>
      <div class="image-wrapper"><img src="pink.jpg" alt="Music"></div>
      <div class="image-wrapper"><img src="tenderboat.jpg" alt="Transport"></div>
      <div class="image-wrapper"><img src="stormyseas.jpg" alt="Water"></div>
      <div class="image-wrapper"><img src="notes.jpg" alt="musical-notes"></div>
      <div class="image-wrapper"><img src="overlook.jpg" alt="Overlook"></div>
      <div class="image-wrapper"><img src="seaspray.jpg" alt="Seaspray"></div>
      <div class="image-wrapper"><img src="canyon.jpg" alt="Standing at the Canyon"></div>
      <div class="image-wrapper"><img src="aloha.jpg" alt="Standing Aloha"></div>
      <div class="image-wrapper"><img src="tugboat.jpg" alt="Tugboat"></div>
      <div class="image-wrapper"><img src="pergola.jpg" alt="Shelters"></div>
      <div class="image-wrapper"><img src="vince3.jpg"   alt="vincePink"></div>
      <div class="image-wrapper"><img src="landscape.jpg"  alt="Landscape"></div>
      <div class="image-wrapper"><img src="acrobat.jpg" alt="perform-acrobats"></div> 
      <div class="image-wrapper"><img src="landscape.jpg" alt="Landscape"></div>
      <div class="image-wrapper"><img src="courthouse.jpg" alt="Courthouse"></div>
      <div class="image-wrapper"><img src="shipwater.jpg" alt="Ship-horizon"></div>     
      <div class="image-wrapper"><img src="sunsethawaii.jpg" alt="Sunset"></div>
      <div class="image-wrapper"><img src="wood.jpg" alt="Wood"></div>
      <div class="image-wrapper"><img src="shipwater.jpg" alt="Horizon-view"></div>
      <div class="image-wrapper"><img src="swimming.jpg" alt="Children-playing in the water"></div>
      <div class="image-wrapper"><img src="rainbow.jpg" alt="tall rainbow"></div>      
      
   </div>


<!-- The Zoom Modal Overlay -->
   <div id="zoomOverlay" class="zoom-overlay">
       <span class="close-btn">&times;</span>
       <img id="zoomedImage" src="" alt="Zoomed View">
   </div>
   
 
         
   

   
  
   

</body>
